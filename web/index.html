<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VizDrive Grand Prix</title>
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon-64.png" />
  <link rel="icon" type="image/png" sizes="256x256" href="./assets/favicon-256.png" />
  <link rel="apple-touch-icon" href="./assets/favicon-256.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@600;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="brand">
    <img src="./assets/vizuara-logo.png" alt="" />
    <span>Viz<b>Drive</b></span>
  </div>
  <div id="hud">
    <div id="hud-left">
      <div id="hud-speed">0</div>
      <div class="hud-unit">km/h</div>
    </div>
    <div id="hud-right">
      <div id="hud-lap">LAP 1/3</div>
      <div id="hud-time">0:00.000</div>
      <div id="hud-best">BEST --:--.---</div>
    </div>
  </div>
  <button id="theme-btn" type="button" title="Toggle day / night">&#9789;</button>
  <button id="music-btn" type="button" title="Toggle music">&#9834;</button>
  <div id="center-msg"></div>
  <div id="leaderboard" class="hidden"></div>
  <div id="banner" class="hidden">
    <div id="banner-title"></div>
    <table id="banner-table"></table>
    <div id="banner-hint">press R to return to the lobby</div>
  </div>
  <div id="help">arrows / WASD drive &middot; C next car &middot; T view &middot; L lidar &middot; N day/night &middot; R menu</div>
  <div id="lobby" class="hidden">
    <div id="lobby-head">
      <img src="./assets/vizuara-logo.png" alt="" id="lobby-logo" />
      <div>
        <div id="lobby-title">VIZDRIVE GRAND PRIX</div>
        <div id="lobby-sub">powered by Vizuara</div>
      </div>
    </div>
    <div id="track-row">
      <div id="track-cards" title="Pick the circuit for the next race"></div>
    </div>
    <div id="agent-table" title="Click agents to add them to the race"></div>
    <div id="agent-tools">
      <button id="add-all-btn" type="button">add all</button>
      <button id="clear-all-btn" type="button">clear all</button>
    </div>
    <label id="lobby-upload" title="Select any number of policy.json files at once">
      upload agent policies (multiple files ok)&hellip;
      <input type="file" id="policy-file" multiple accept=".json,application/json" />
    </label>
    <div id="roster"></div>
    <label id="human-row">
      <input type="checkbox" id="human-checkbox" />
      I race too
    </label>
    <div id="lobby-status"></div>
    <button id="start-btn">START RACE</button>
    <div id="lobby-footer">
      <a href="https://github.com/sreedath/vizdrive" target="_blank" rel="noopener" id="github-link" title="VizDrive source on GitHub">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        VizDrive
      </a>
      <a href="https://github.com/sreedath/race-agent-lab" target="_blank" rel="noopener" title="Train your own agent (Colab via GitHub)">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        train your agent
      </a>
    </div>
  </div>
  <div id="loading">
    <img src="./assets/vizuara-logo.png" id="loading-logo" alt="" />
    <div id="loading-word">Viz<span>Drive</span></div>
    <div id="loading-sub">GRAND PRIX &middot; POWERED BY VIZUARA</div>
    <div id="loading-msg">warming up the grid<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
  </div>
  <script type="module" src="./js/game/loop.js"></script>
</body>
</html>
