[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "racing"
version = "0.1.0"
description = "Lightweight 3D browser racing with a PPO agent (human vs agent)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["racing*"]

[tool.pytest.ini_options]
testpaths = ["racing/tests"]
